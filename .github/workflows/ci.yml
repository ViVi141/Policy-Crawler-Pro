name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: production
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            target: ''
          - name: db
            context: ./database
            dockerfile: ./database/Dockerfile
            target: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mnr-law-crawler-online-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image (with target)
        if: matrix.service.target != ''
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: ${{ matrix.service.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and push Docker image (without target)
        if: matrix.service.target == ''
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: build-and-push

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for database
        run: |
          echo "等待数据库就绪..."
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U test_user; do sleep 2; done' || exit 1
          echo "数据库已就绪"

      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          JWT_SECRET_KEY: test-secret-key-for-ci
        run: |
          # 运行数据库迁移
          if [ -d "migrations" ]; then
            pip install alembic
            alembic upgrade head || echo "迁移失败或无需迁移"
          else
            echo "未找到迁移目录，跳过迁移"
          fi

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          JWT_SECRET_KEY: test-secret-key-for-ci
          PYTHONPATH: .
        run: |
          echo "=== 运行后端测试 ==="
          pip install pytest pytest-asyncio httpx pytest-cov
          
          # 验证应用可以正常导入
          echo "验证应用导入..."
          python -c "from app.main import app; print('✅ 应用可以正常导入')" || exit 1
          
          # 验证所有关键模块可以导入
          echo "验证关键模块导入..."
          python -c "
          from app.database import engine, SessionLocal
          from app.models import User, Task, Policy, BackupRecord
          from app.services import TaskService, AuthService, PolicyService, BackupService
          print('✅ 所有关键模块导入成功')
          " || exit 1
          
          # 验证数据库连接
          echo "验证数据库连接..."
          python -c "
          from app.database import engine
          from sqlalchemy import text
          with engine.connect() as conn:
              result = conn.execute(text('SELECT 1'))
              assert result.fetchone()[0] == 1
              print('✅ 数据库连接正常')
          " || exit 1
          
          # 运行pytest测试（如果存在）
          if [ -f "pytest.ini" ] || [ -d "tests" ] || [ -f "test_*.py" ]; then
            echo "发现测试文件，运行pytest..."
            pytest -v --tb=short --cov=app --cov-report=term-missing || exit 1
          else
            echo "⚠️ 未找到pytest测试文件，但基础验证已通过"
          fi
          
          # 验证API路由注册
          echo "验证API路由..."
          python -c "
          from app.main import app
          routes = [r.path for r in app.routes]
          required_routes = ['/api/health', '/api/auth/login', '/api/tasks/', '/api/policies/']
          for route in required_routes:
              if any(route in r for r in routes):
                  print(f'✅ 路由 {route} 已注册')
              else:
                  print(f'⚠️ 路由 {route} 未找到')
          print('✅ API路由验证完成')
          " || exit 1
          
          echo "✅ 所有测试通过"

      - name: Check code quality
        working-directory: ./backend
        run: |
          echo "=== 代码质量检查 ==="
          pip install flake8 black mypy pylint
          
          # 语法错误检查（强制，不允许失败）
          echo "检查Python语法错误..."
          python -m py_compile app/main.py app/config.py || exit 1
          find app -name "*.py" -exec python -m py_compile {} \; || exit 1
          echo "✅ 语法检查通过"
          
          # 代码格式检查（强制）
          echo "检查代码格式（Black）..."
          if ! black --check . 2>&1; then
            echo "❌ 代码格式不符合Black规范"
            echo ""
            echo "请运行以下命令格式化代码："
            echo "  cd backend"
            echo "  black ."
            echo ""
            echo "或者查看需要格式化的文件："
            black --check --diff . 2>&1 | head -50 || true
            echo ""
            echo "（显示前50行差异，完整差异请运行: black --check --diff .）"
            exit 1
          fi
          echo "✅ 代码格式检查通过"
          
          # Flake8检查（强制关键错误）
          echo "检查代码质量（Flake8）..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=120 --exclude=__pycache__,migrations || exit 1
          echo "✅ Flake8关键错误检查通过"
          
          # 类型检查（警告但不阻塞）
          echo "检查类型注解（MyPy）..."
          mypy app --ignore-missing-imports --no-strict-optional --show-error-codes || echo "⚠️ 类型检查有警告（非阻塞）"
          
          # 运行自定义类型检查脚本
          echo "运行自定义类型检查..."
          python check_types.py app --exclude __pycache__ migrations tests --summary || echo "⚠️ 自定义类型检查发现问题（非阻塞）"
          
          # 检查导入依赖
          echo "验证依赖导入..."
          python -c "
          import sys
          # 模块名映射：安装包名 -> 导入名
          required_modules = {
              'fastapi': 'fastapi',
              'sqlalchemy': 'sqlalchemy',
              'pydantic': 'pydantic',
              'alembic': 'alembic',
              'python-docx': 'docx',  # python-docx 安装后导入名为 docx
              'aiosmtplib': 'aiosmtplib'
          }
          missing = []
          for package_name, import_name in required_modules.items():
              try:
                  __import__(import_name)
              except ImportError:
                  missing.append(package_name)
          if missing:
              print(f'❌ 缺少依赖: {missing}')
              sys.exit(1)
          print('✅ 所有依赖已安装')
          " || exit 1
          
          echo "✅ 代码质量检查完成"

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps || \
          (echo "npm ci 失败，尝试使用 npm install..." && npm install --legacy-peer-deps)

      - name: Run linter
        working-directory: ./frontend
        run: |
          echo "=== 运行前端代码检查 ==="
          npm run lint || exit 1
          echo "✅ 代码检查通过"

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ""  # 生产环境使用空字符串（相对路径）
        run: |
          echo "=== 构建前端应用 ==="
          
          # 验证TypeScript编译
          echo "验证TypeScript编译..."
          npm run build || exit 1
          
          # 验证构建产物
          if [ ! -d "dist" ]; then
            echo "❌ 构建失败，dist 目录不存在"
            exit 1
          fi
          echo "✅ 构建成功，dist 目录已创建"
          
          # 检查关键文件
          echo "验证构建产物..."
          [ -f "dist/index.html" ] || (echo "❌ index.html 不存在" && exit 1)
          
          # 检查JavaScript文件（使用ls来查找匹配的文件）
          JS_FILES=$(ls dist/assets/*.js 2>/dev/null | head -1)
          if [ -z "$JS_FILES" ]; then
            echo "❌ JavaScript文件不存在"
            echo "dist/assets 目录内容："
            ls -la dist/assets/ 2>/dev/null || echo "dist/assets 目录不存在"
            exit 1
          else
            echo "✅ 找到JavaScript文件: $(echo $JS_FILES | xargs basename)"
          fi
          
          # 检查CSS文件（可选）
          CSS_FILES=$(ls dist/assets/*.css 2>/dev/null | head -1)
          if [ -z "$CSS_FILES" ]; then
            echo "⚠️ CSS文件可能不存在（如果使用内联样式）"
          else
            echo "✅ 找到CSS文件: $(echo $CSS_FILES | xargs basename)"
          fi
          
          # 验证index.html内容
          echo "验证index.html内容..."
          grep -q "<!DOCTYPE html>" dist/index.html || (echo "❌ index.html格式错误" && exit 1)
          grep -q "id=\"app\"" dist/index.html || (echo "❌ Vue应用根元素不存在" && exit 1)
          
          # 检查静态资源
          echo "检查静态资源..."
          if [ -d "dist/assets" ]; then
            ASSET_COUNT=$(ls -1 dist/assets/*.js 2>/dev/null | wc -l)
            if [ "$ASSET_COUNT" -eq 0 ]; then
              echo "❌ 没有找到JavaScript资源文件"
              exit 1
            fi
            echo "✅ 找到 $ASSET_COUNT 个JavaScript资源文件"
          fi
          
          # 验证环境变量注入
          echo "验证环境变量..."
          if grep -q "VITE_API_BASE_URL" dist/index.html 2>/dev/null || grep -q "/api" dist/assets/*.js 2>/dev/null; then
            echo "✅ API配置已正确注入"
          else
            echo "⚠️ 未检测到API配置（可能使用相对路径）"
          fi
          
          # 显示构建统计
          echo "=== 构建统计 ==="
          du -sh dist/
          find dist -type f | wc -l | xargs echo "文件总数:"
          ls -lah dist/ | head -15
          
          echo "✅ 构建验证通过"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # 不阻塞构建，仅报告

      - name: Determine image tags
        id: image-tags
        run: |
          # 根据事件类型确定可能的镜像标签
          TAGS=""
          
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TAGS="pr-${{ github.event.pull_request.number }} pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
          elif [ "${{ github.event_name }}" == "release" ]; then
            TAGS="${{ github.event.release.tag_name }} latest"
          elif [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/master" ]; then
            TAGS="latest main-${{ github.sha }} master-${{ github.sha }}"
          else
            BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's/refs\/heads\///' | sed 's/\//-/g')
            TAGS="${BRANCH_NAME} ${BRANCH_NAME}-${{ github.sha }}"
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "可能的镜像标签: ${TAGS}"

      - name: Check if backend image exists
        id: check-backend-image
        continue-on-error: true
        run: |
          # 尝试多个可能的标签
          TAGS='${{ steps.image-tags.outputs.tags }}'
          BASE_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mnr-law-crawler-online-backend"
          
          echo "尝试查找后端镜像..."
          FOUND_IMAGE=""
          FOUND_TAG=""
          
          # 遍历标签列表
          for TAG in ${TAGS}; do
            IMAGE_NAME="${BASE_IMAGE}:${TAG}"
            echo "检查: ${IMAGE_NAME}"
            
            if docker manifest inspect "${IMAGE_NAME}" >/dev/null 2>&1; then
              FOUND_IMAGE="${IMAGE_NAME}"
              FOUND_TAG="${TAG}"
              echo "✅ 找到镜像: ${IMAGE_NAME}"
              break
            fi
          done
          
          if [ -n "${FOUND_IMAGE}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "image=${FOUND_IMAGE}" >> $GITHUB_OUTPUT
            echo "tag=${FOUND_TAG}" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ 未找到后端镜像，跳过扫描"
            echo "尝试的标签: ${TAGS}"
          fi

      - name: Scan backend Docker image
        if: steps.check-backend-image.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.check-backend-image.outputs.image }}
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check if frontend image exists
        id: check-frontend-image
        continue-on-error: true
        run: |
          # 尝试多个可能的标签
          TAGS='${{ steps.image-tags.outputs.tags }}'
          BASE_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mnr-law-crawler-online-frontend"
          
          echo "尝试查找前端镜像..."
          FOUND_IMAGE=""
          FOUND_TAG=""
          
          # 遍历标签列表
          for TAG in ${TAGS}; do
            IMAGE_NAME="${BASE_IMAGE}:${TAG}"
            echo "检查: ${IMAGE_NAME}"
            
            if docker manifest inspect "${IMAGE_NAME}" >/dev/null 2>&1; then
              FOUND_IMAGE="${IMAGE_NAME}"
              FOUND_TAG="${TAG}"
              echo "✅ 找到前端镜像: ${IMAGE_NAME}"
              break
            fi
          done
          
          if [ -n "${FOUND_IMAGE}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "image=${FOUND_IMAGE}" >> $GITHUB_OUTPUT
            echo "tag=${FOUND_TAG}" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ 未找到前端镜像，跳过扫描"
          fi

      - name: Scan frontend Docker image
        if: steps.check-frontend-image.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.check-frontend-image.outputs.image }}
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy filesystem results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'

      - name: Upload Trivy backend image results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.check-backend-image.outputs.exists == 'true'
        with:
          sarif_file: 'trivy-backend-results.sarif'

      - name: Upload Trivy frontend image results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.check-frontend-image.outputs.exists == 'true'
        with:
          sarif_file: 'trivy-frontend-results.sarif'

      - name: Security scan summary
        if: always()
        run: |
          echo "=== 安全扫描摘要 ==="
          echo ""
          
          if [ -f "trivy-fs-results.sarif" ]; then
            echo "✅ 文件系统扫描完成"
          else
            echo "⚠️ 文件系统扫描未完成"
          fi
          
          if [ -f "trivy-backend-results.sarif" ]; then
            echo "✅ 后端 Docker 镜像扫描完成"
          else
            echo "⚠️ 后端镜像扫描未完成（镜像可能不存在或使用不同标签）"
          fi
          
          if [ -f "trivy-frontend-results.sarif" ]; then
            echo "✅ 前端 Docker 镜像扫描完成"
          else
            echo "⚠️ 前端镜像扫描未完成（镜像可能不存在或使用不同标签）"
          fi
          
          echo ""
          echo "详细结果已上传到 GitHub Security（如果可用）"

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-and-push, test-backend, test-frontend]
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate release notes
        id: release_notes
        run: |
          echo "## 🐳 Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "以下镜像已构建并推送到 GitHub Container Registry:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mnr-law-crawler-online-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mnr-law-crawler-online-frontend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mnr-law-crawler-online-db:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 使用方式" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# 拉取镜像" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mnr-law-crawler-online-backend:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mnr-law-crawler-online-frontend:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mnr-law-crawler-online-db:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
